<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>絵コンテ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --text-muted: #666;
    --timeline-width: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex-direction: column; height: 100dvh; }
  .screen.active { display: flex; }

  .topbar {
    display: flex; align-items: center;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 12px; flex-shrink: 0;
  }
  .topbar-title {
    font-family: 'Space Mono', monospace;
    font-size: 14px; letter-spacing: 0.05em;
    color: var(--accent); flex: 1;
  }
  .topbar-back {
    background: none; border: none;
    color: var(--text-muted); font-size: 20px;
    cursor: pointer; padding: 4px; line-height: 1;
  }

  #screen-list .content {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .project-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.15s;
  }
  .project-card:active { border-color: var(--accent); }
  .project-card-icon {
    width: 44px; height: 44px;
    background: var(--surface2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .project-card-info { flex: 1; min-width: 0; }
  .project-card-name {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .project-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .project-card-arrow { color: var(--text-muted); font-size: 18px; }

  .btn-new-project {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #000;
    border: none; border-radius: 12px; padding: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; width: 100%;
  }
  .btn-new-project:active { opacity: 0.8; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-muted); padding: 40px; text-align: center;
  }
  .empty-state-icon { font-size: 48px; }
  .empty-state-text { font-size: 14px; line-height: 1.6; }

  #screen-timeline { position: relative; }

  .timeline-controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; flex-direction: column; gap: 10px;
    flex-shrink: 0;
  }
  .audio-section { display: flex; align-items: center; gap: 10px; }
  .btn-audio-upload {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    white-space: nowrap; font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-audio-upload:active { background: var(--border); }
  .audio-filename {
    font-size: 12px; color: var(--text-muted); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .playback-row { display: flex; align-items: center; gap: 12px; }
  .btn-play {
    width: 44px; height: 44px;
    background: var(--accent); border: none; border-radius: 50%;
    color: #000; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-play:active { opacity: 0.8; }
  .btn-play:disabled { background: var(--border); color: var(--text-muted); }
  .time-display {
    font-family: 'Space Mono', monospace;
    font-size: 13px; color: var(--accent); white-space: nowrap; flex: 1;
  }
  .btn-split {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent2); border: none; border-radius: 8px;
    color: #fff; padding: 10px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
  }
  .btn-split:active { opacity: 0.8; }
  .btn-split:disabled { background: var(--border); color: var(--text-muted); }

  /* シークバー */
  .seekbar-row { display: flex; align-items: center; gap: 8px; }
  .seekbar-wrap { flex: 1; position: relative; height: 20px; display: flex; align-items: center; }
  .seekbar-track { width: 100%; height: 4px; background: var(--border); border-radius: 2px; position: relative; }
  .seekbar-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 2px; pointer-events: none; }
  input[type=range].seekbar {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 100%; height: 20px;
    -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer; margin: 0;
  }
  input[type=range].seekbar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    background: var(--accent); border-radius: 50%; border: none;
  }
  input[type=range].seekbar:disabled::-webkit-slider-thumb { background: var(--border); }

  .timeline-body { flex: 1; overflow-y: auto; position: relative; }
  .timeline-inner { position: relative; min-height: 100%; }

  .timeline-ruler {
    position: absolute; left: 0; top: 0;
    width: var(--timeline-width); height: 100%;
    background: var(--surface);
    border-right: 2px solid var(--accent);
    z-index: 10;
  }
  .ruler-tick {
    position: absolute; left: 0; width: 100%;
    display: flex; align-items: center;
    justify-content: flex-end; padding-right: 8px;
  }
  .ruler-tick-line {
    position: absolute; right: 0; width: 8px; height: 1px;
    background: var(--border);
  }
  .ruler-tick.major .ruler-tick-line { width: 14px; background: var(--text-muted); }
  .ruler-tick-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; color: var(--text-muted); line-height: 1;
  }
  .ruler-tick.major .ruler-tick-label { color: var(--text); font-size: 10px; }

  .playhead {
    position: absolute; left: 0; width: 100%;
    height: 2px; background: var(--accent);
    z-index: 20; pointer-events: none;
  }
  .playhead::before {
    content: '';
    position: absolute;
    left: calc(var(--timeline-width) - 6px);
    top: -5px;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid var(--accent);
  }
  .playhead-draggable {
    pointer-events: all;
    position: absolute; left: 0; top: -12px;
    width: var(--timeline-width); height: 26px;
    cursor: row-resize;
  }

  .cuts-area {
    position: absolute;
    left: var(--timeline-width); top: 0; right: 0; bottom: 0;
  }

  .cut-block {
    position: absolute; left: 0; right: 0;
    background: var(--surface2);
    border-left: 3px solid var(--accent2);
    cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .cut-block:active { background: #252515; }

  .cut-divider {
    position: absolute; left: 0; width: 100%; height: 2px;
    background: var(--accent2); z-index: 5; pointer-events: none;
  }

  .cut-content {
    flex: 1; display: flex; align-items: flex-start;
    gap: 8px; padding: 6px 8px; overflow: hidden; min-height: 0;
  }
  .cut-thumb {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 4px; object-fit: cover;
  }
  .cut-thumb-placeholder {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 4px; background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-muted);
  }
  .cut-info { flex: 1; min-width: 0; overflow: hidden; }
  .cut-number {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--accent2); margin-bottom: 2px;
  }
  .cut-text-preview {
    font-size: 11px; color: var(--text-muted);
    line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .cut-duration-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; color: var(--border);
    position: absolute; bottom: 3px; right: 6px;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    align-items: flex-end;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface); border-radius: 20px 20px 0 0;
    width: 100%; max-height: 90dvh;
    display: flex; flex-direction: column;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
  }
  .modal-title {
    font-size: 16px; font-weight: 700;
    padding: 16px 20px 8px; flex-shrink: 0;
  }
  .modal-body {
    flex: 1; overflow-y: auto;
    padding: 0 20px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px; padding: 12px; outline: none;
  }
  .form-input:focus { border-color: var(--accent); }
  textarea.form-input { resize: none; min-height: 100px; }

  .image-upload-area {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface2); border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; overflow: hidden; position: relative;
  }
  .image-upload-area img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .image-upload-icon { font-size: 32px; }
  .image-upload-text { font-size: 13px; color: var(--text-muted); }

  .merge-row { display: flex; gap: 8px; }
  .btn-merge {
    flex: 1; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 8px;
    font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; text-align: center; line-height: 1.4;
  }
  .btn-merge:active { background: var(--border); }
  .btn-merge:disabled { opacity: 0.3; cursor: default; }

  .modal-actions {
    display: flex; gap: 10px;
    padding: 12px 20px 20px; flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .btn-modal-delete {
    background: none; border: 1px solid #ff4444;
    color: #ff4444; border-radius: 8px;
    padding: 12px 16px; font-size: 14px; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-modal-save {
    flex: 1; background: var(--accent); border: none;
    border-radius: 8px; color: #000;
    font-size: 14px; font-weight: 700; padding: 12px;
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-modal-cancel {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px;
    padding: 12px 16px; font-size: 14px; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* 長押しメニュー */
  .context-menu {
    position: fixed; z-index: 200;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-width: 160px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    animation: fadeIn 0.12s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .context-menu-item {
    padding: 14px 18px;
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .context-menu-item:last-child { border-bottom: none; }
  .context-menu-item:active { background: var(--surface2); }
  .context-menu-item.danger { color: #ff4444; }
  .context-menu-overlay {
    position: fixed; inset: 0; z-index: 199;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- PROJECT LIST -->
<div class="screen active" id="screen-list">
  <div class="topbar">
    <span class="topbar-title">STORYBOARD</span>
    <button class="btn-new-project" id="btn-open-new-project" style="width:auto;padding:8px 16px;font-size:13px;">+ 新規</button>
  </div>
  <div class="content" id="project-list-content">
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">movie_creation</div>
      <div class="empty-state-text">プロジェクトがまだありません<br>「新規」から作成してください</div>
    </div>
  </div>
</div>

<!-- TIMELINE -->
<div class="screen" id="screen-timeline">
  <div class="topbar">
    <button class="topbar-back" id="btn-back">&larr;</button>
    <span class="topbar-title" id="timeline-title">PROJECT</span>
  </div>

  <div class="timeline-controls">
    <div class="audio-section">
      <label class="btn-audio-upload" for="audio-file-input">&#127925; 音源を読み込む</label>
      <span class="audio-filename" id="audio-filename">ファイルなし</span>
      <input type="file" id="audio-file-input" accept="audio/*" style="position:absolute;opacity:0;width:0;height:0;">
    </div>
    <div class="seekbar-row">
      <div class="seekbar-wrap">
        <div class="seekbar-track"><div class="seekbar-fill" id="seekbar-fill" style="width:0%"></div></div>
        <input type="range" class="seekbar" id="seekbar" min="0" max="1000" value="0" step="1" disabled>
      </div>
    </div>
    <div class="playback-row">
      <button class="btn-play" id="btn-play" disabled>&#9654;</button>
      <span class="time-display" id="time-display">0:00.0 / 0:00.0</span>
      <button class="btn-split" id="btn-split" disabled>&#9986; ここで分割</button>
    </div>
  </div>

  <div class="timeline-body" id="timeline-body">
    <div class="timeline-inner" id="timeline-inner">
      <div class="timeline-ruler" id="timeline-ruler"></div>
      <div class="playhead" id="playhead">
        <div class="playhead-draggable" id="playhead-draggable"></div>
      </div>
      <div class="cuts-area" id="cuts-area"></div>
    </div>
  </div>
</div>

<!-- MODAL: NEW PROJECT -->
<div class="modal-overlay" id="modal-project">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">新規プロジェクト</div>
    <div class="modal-body">
      <div>
        <label class="form-label">プロジェクト名</label>
        <input type="text" class="form-input" id="new-project-name" placeholder="例：MV 春の詩">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btn-cancel-project">キャンセル</button>
      <button class="btn-modal-save" id="btn-create-project">作成</button>
    </div>
  </div>
</div>

<!-- MODAL: CUT EDIT -->
<div class="modal-overlay" id="modal-cut">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="cut-modal-title">カット編集</div>
    <div class="modal-body">
      <div>
        <label class="form-label">画像</label>
        <label class="image-upload-area" id="cut-image-area" for="cut-image-input">
          <div class="image-upload-icon">&#128444;</div>
          <div class="image-upload-text">タップして画像を選択</div>
        </label>
        <input type="file" id="cut-image-input" accept="image/*" style="position:absolute;opacity:0;width:0;height:0;">
      </div>
      <div>
        <label class="form-label">テキストメモ</label>
        <textarea class="form-input" id="cut-text" placeholder="セリフ、動き、演出メモなど..."></textarea>
      </div>
      <div>
        <label class="form-label">結合</label>
        <div class="merge-row">
          <button class="btn-merge" id="btn-merge-prev">&#8593; 前のカットと結合</button>
          <button class="btn-merge" id="btn-merge-next">&#8595; 次のカットと結合</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-delete" id="btn-delete-cut">削除</button>
      <button class="btn-modal-cancel" id="btn-cancel-cut">閉じる</button>
      <button class="btn-modal-save" id="btn-save-cut">保存</button>
    </div>
  </div>
</div>

<script>
let projects = JSON.parse(localStorage.getItem('storyboard_projects') || '[]');
let currentProjectId = null;
let currentCutId = null;
let audio = null;
let isPlaying = false;
let animationFrame = null;
let currentTime = 0;
let duration = 0;

const PX_PER_SEC = 80;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function saveProjects() { localStorage.setItem('storyboard_projects', JSON.stringify(projects)); }
function getProject(id) { return projects.find(p => p.id === id); }
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1).padStart(4, '0');
  return m + ':' + s;
}

// IndexedDB
let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open('storyboard_audio', 1);
    req.onupgradeneeded = (e) => e.target.result.createObjectStore('audio');
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = reject;
  });
}
async function saveAudioToDB(projectId, file) {
  const database = await openDB();
  return new Promise((resolve, reject) => {
    const tx = database.transaction('audio', 'readwrite');
    tx.objectStore('audio').put(file, projectId);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
async function loadAudioFromDB(projectId) {
  const database = await openDB();
  return new Promise((resolve, reject) => {
    const tx = database.transaction('audio', 'readonly');
    const req = tx.objectStore('audio').get(projectId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = reject;
  });
}

// IndexedDB: delete audio
async function deleteAudioFromDB(projectId) {
  const database = await openDB();
  return new Promise((resolve, reject) => {
    const tx = database.transaction('audio', 'readwrite');
    tx.objectStore('audio').delete(projectId);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}

// Context menu
function showProjectContextMenu(projectId, x, y) {
  // 既存メニューを閉じる
  closeContextMenu();

  const overlay = document.createElement('div');
  overlay.className = 'context-menu-overlay';
  overlay.addEventListener('click', closeContextMenu);
  document.body.appendChild(overlay);

  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'context-menu';

  // 表示位置をビューポートに収める
  const menuW = 160;
  const menuH = 100;
  let left = Math.min(x, window.innerWidth - menuW - 8);
  let top = Math.min(y, window.innerHeight - menuH - 8);

  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  const deleteItem = document.createElement('div');
  deleteItem.className = 'context-menu-item danger';
  deleteItem.innerHTML = '&#128465; プロジェクトを削除';
  deleteItem.addEventListener('click', async () => {
    closeContextMenu();
    if (!confirm('\u3053\u306E\u30D7\u30ED\u30B8\u30A7\u30AF\u30C8\u3092\u524A\u9664\u3057\u307E\u3059\u304B\uFF1F\n\u30AB\u30C3\u30C8\u3084\u97F3\u6E90\u3082\u3059\u3079\u3066\u524A\u9664\u3055\u308C\u307E\u3059\u3002')) return;
    try { await deleteAudioFromDB(projectId); } catch(e) { console.error(e); }
    projects = projects.filter(p => p.id !== projectId);
    saveProjects();
    renderProjectList();
  });
  menu.appendChild(deleteItem);

  document.body.appendChild(menu);
}

function closeContextMenu() {
  const menu = document.getElementById('context-menu');
  if (menu) menu.remove();
  document.querySelectorAll('.context-menu-overlay').forEach(el => el.remove());
}

// Project list
function renderProjectList() {
  const content = document.getElementById('project-list-content');
  content.querySelectorAll('.project-card').forEach(el => el.remove());
  document.getElementById('empty-state').style.display = projects.length === 0 ? 'flex' : 'none';

  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML =
      '<div class="project-card-icon">&#127909;</div>' +
      '<div class="project-card-info">' +
        '<div class="project-card-name">' + p.name + '</div>' +
        '<div class="project-card-meta">' + p.cuts.length + 'カット</div>' +
      '</div>' +
      '<div class="project-card-arrow">&#8250;</div>';
    // タップで開く
    card.addEventListener('click', () => openProject(p.id));

    // 長押しで削除メニュー
    let longPressTimer = null;
    card.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => {
        e.preventDefault();
        showProjectContextMenu(p.id, e.touches[0].clientX, e.touches[0].clientY);
      }, 600);
    }, { passive: true });
    card.addEventListener('touchend', () => clearTimeout(longPressTimer));
    card.addEventListener('touchmove', () => clearTimeout(longPressTimer));

    content.appendChild(card);
  });

  let newBtn = content.querySelector('.btn-new-project');
  if (!newBtn) {
    newBtn = document.createElement('button');
    newBtn.className = 'btn-new-project';
    newBtn.textContent = '+ 新規プロジェクト';
    newBtn.addEventListener('click', () => showModal('modal-project'));
    content.appendChild(newBtn);
  }
}

document.getElementById('btn-open-new-project').addEventListener('click', () => showModal('modal-project'));
document.getElementById('btn-cancel-project').addEventListener('click', () => hideModal('modal-project'));
document.getElementById('btn-create-project').addEventListener('click', () => {
  const name = document.getElementById('new-project-name').value.trim();
  if (!name) return;
  projects.unshift({ id: uid(), name: name, cuts: [], audioName: null });
  saveProjects();
  document.getElementById('new-project-name').value = '';
  hideModal('modal-project');
  renderProjectList();
});

// Open project
async function openProject(id) {
  currentProjectId = id;
  const project = getProject(id);
  document.getElementById('timeline-title').textContent = project.name;
  resetAudio();
  showScreen('screen-timeline');
  renderTimeline();

  if (project.audioName) {
    try {
      const blob = await loadAudioFromDB(id);
      if (blob) loadAudioFromBlob(blob, project.audioName);
    } catch(e) { console.error(e); }
  }
}

document.getElementById('btn-back').addEventListener('click', () => {
  stopAudio();
  showScreen('screen-list');
  renderProjectList();
});

// Audio
document.getElementById('audio-file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  document.getElementById('audio-filename').textContent = '読み込み中...';
  try {
    await saveAudioToDB(currentProjectId, file);
    const project = getProject(currentProjectId);
    project.audioName = file.name;
    // 音源を新規読み込みする場合はカットをリセット
    project.cuts = [];
    saveProjects();
    loadAudioFromBlob(file, file.name);
  } catch(e) {
    console.error(e);
    document.getElementById('audio-filename').textContent = '読み込みエラー';
  }
});

function loadAudioFromBlob(blob, name) {
  resetAudio();
  const url = URL.createObjectURL(blob);
  audio = new Audio(url);
  audio._objectUrl = url;
  audio.addEventListener('loadedmetadata', () => {
    duration = audio.duration;
    updateTimeDisplay();
    document.getElementById('btn-play').disabled = false;
    document.getElementById('btn-split').disabled = false;
    document.getElementById('seekbar').disabled = false;

    // 全体を1カットとして生成（カットが空のとき）
    const project = getProject(currentProjectId);
    if (project.cuts.length === 0) {
      project.cuts = [{ id: uid(), startTime: 0, endTime: duration, imageData: null, text: '' }];
      saveProjects();
    }
    renderTimeline();
  });
  audio.addEventListener('error', () => {
    document.getElementById('audio-filename').textContent = '再生エラー';
  });
  audio.addEventListener('ended', () => {
    isPlaying = false;
    currentTime = 0;
    audio.currentTime = 0;
    document.getElementById('btn-play').textContent = '\u25B6';
    cancelAnimationFrame(animationFrame);
    updateTimeDisplay();
    updatePlayheadPosition();
  });
  document.getElementById('audio-filename').textContent = name;
}

function resetAudio() {
  if (audio) {
    audio.pause();
    if (audio._objectUrl) URL.revokeObjectURL(audio._objectUrl);
    audio = null;
  }
  isPlaying = false; currentTime = 0; duration = 0;
  document.getElementById('btn-play').textContent = '\u25B6';
  document.getElementById('btn-play').disabled = true;
  document.getElementById('btn-split').disabled = true;
  document.getElementById('seekbar').disabled = true;
  document.getElementById('seekbar').value = 0;
  document.getElementById('seekbar-fill').style.width = '0%';
  document.getElementById('audio-filename').textContent = 'ファイルなし';
  cancelAnimationFrame(animationFrame);
}

function stopAudio() {
  if (audio) audio.pause();
  isPlaying = false;
  cancelAnimationFrame(animationFrame);
}

document.getElementById('btn-play').addEventListener('click', () => {
  if (!audio) return;
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    document.getElementById('btn-play').textContent = '\u25B6';
    cancelAnimationFrame(animationFrame);
  } else {
    if (duration > 0 && currentTime >= duration - 0.1) currentTime = 0;
    audio.currentTime = currentTime;
    audio.play().catch(e => console.error(e));
    isPlaying = true;
    document.getElementById('btn-play').textContent = '\u23F8';
    animatePlayhead();
  }
});

function animatePlayhead() {
  if (!isPlaying || !audio) return;
  currentTime = audio.currentTime;
  updateTimeDisplay();
  updatePlayheadPosition();
  animationFrame = requestAnimationFrame(animatePlayhead);
}
function updateTimeDisplay() {
  document.getElementById('time-display').textContent = formatTime(currentTime) + ' / ' + formatTime(duration);
  if (duration > 0) {
    const pct = (currentTime / duration) * 100;
    document.getElementById('seekbar').value = Math.round((currentTime / duration) * 1000);
    document.getElementById('seekbar-fill').style.width = pct + '%';
  }
}
function updatePlayheadPosition() {
  document.getElementById('playhead').style.top = (currentTime * PX_PER_SEC) + 'px';
}

// Playhead drag
const playheadDrag = document.getElementById('playhead-draggable');
let isDraggingPlayhead = false;

playheadDrag.addEventListener('touchstart', (e) => {
  isDraggingPlayhead = true;
  if (isPlaying) audio.pause();
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isDraggingPlayhead) return;
  const body = document.getElementById('timeline-body');
  const bodyRect = body.getBoundingClientRect();
  const touchY = e.touches[0].clientY - bodyRect.top + body.scrollTop;
  currentTime = Math.max(0, Math.min(duration || 999, touchY / PX_PER_SEC));
  updateTimeDisplay();
  updatePlayheadPosition();
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!isDraggingPlayhead) return;
  isDraggingPlayhead = false;
  if (isPlaying && audio) { audio.currentTime = currentTime; audio.play(); }
});

// Seekbar
const seekbar = document.getElementById('seekbar');
seekbar.addEventListener('input', () => {
  if (!duration) return;
  const wasPlaying = isPlaying;
  if (isPlaying) { audio.pause(); isPlaying = false; cancelAnimationFrame(animationFrame); }
  currentTime = (seekbar.value / 1000) * duration;
  if (audio) audio.currentTime = currentTime;
  updateTimeDisplay();
  updatePlayheadPosition();
  // スクロールをplayheadに合わせる
  const body = document.getElementById('timeline-body');
  const targetScroll = currentTime * PX_PER_SEC - body.clientHeight / 2;
  body.scrollTop = Math.max(0, targetScroll);
  if (wasPlaying && audio) {
    audio.play().catch(e => console.error(e));
    isPlaying = true;
    document.getElementById('btn-play').textContent = '⏸';
    animatePlayhead();
  }
});

// タイムライン上のタップで再生位置を移動
document.getElementById('timeline-body').addEventListener('click', (e) => {
  if (!duration) return;
  // playhead-draggable やカットブロックのタップは除外
  if (e.target.closest('.cut-block') || e.target.closest('.playhead-draggable')) return;
  const body = document.getElementById('timeline-body');
  const bodyRect = body.getBoundingClientRect();
  const clickY = e.clientY - bodyRect.top + body.scrollTop;
  const newTime = Math.max(0, Math.min(duration, clickY / PX_PER_SEC));
  currentTime = newTime;
  if (audio) audio.currentTime = currentTime;
  updateTimeDisplay();
  updatePlayheadPosition();
});

// Split
document.getElementById('btn-split').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  if (!project || !duration) return;

  const t = parseFloat(currentTime.toFixed(2));
  const idx = project.cuts.findIndex(c => c.startTime <= t && c.endTime > t);
  if (idx === -1) return;

  const cut = project.cuts[idx];
  if (t - cut.startTime < 0.5 || cut.endTime - t < 0.5) return;

  const newCut = { id: uid(), startTime: t, endTime: cut.endTime, imageData: null, text: '' };
  cut.endTime = t;
  project.cuts.splice(idx + 1, 0, newCut);
  saveProjects();
  renderTimeline();
});

// Ruler
function renderRuler() {
  const ruler = document.getElementById('timeline-ruler');
  ruler.innerHTML = '';
  const totalSec = Math.max(duration, 30);
  document.getElementById('timeline-inner').style.height = (totalSec * PX_PER_SEC + 120) + 'px';

  for (let s = 0; s <= totalSec; s++) {
    const isMajor = s % 5 === 0;
    const tick = document.createElement('div');
    tick.className = 'ruler-tick' + (isMajor ? ' major' : '');
    tick.style.top = (s * PX_PER_SEC) + 'px';
    const label = document.createElement('span');
    label.className = 'ruler-tick-label';
    label.textContent = isMajor ? formatTime(s) : '';
    const line = document.createElement('div');
    line.className = 'ruler-tick-line';
    tick.appendChild(label);
    tick.appendChild(line);
    ruler.appendChild(tick);
  }
}

// Render timeline
function renderTimeline() {
  renderRuler();
  const area = document.getElementById('cuts-area');
  area.innerHTML = '';
  const project = getProject(currentProjectId);
  if (!project) return;

  project.cuts.sort((a, b) => a.startTime - b.startTime);

  project.cuts.forEach((cut, idx) => {
    const top = cut.startTime * PX_PER_SEC;
    const height = Math.max((cut.endTime - cut.startTime) * PX_PER_SEC, 44);

    // 分割線
    if (idx > 0) {
      const divider = document.createElement('div');
      divider.className = 'cut-divider';
      divider.style.top = top + 'px';
      area.appendChild(divider);
    }

    const el = document.createElement('div');
    el.className = 'cut-block';
    el.dataset.id = cut.id;
    el.style.top = top + 'px';
    el.style.height = height + 'px';

    const durSec = (cut.endTime - cut.startTime).toFixed(1);

    const content = document.createElement('div');
    content.className = 'cut-content';

    if (cut.imageData) {
      const img = document.createElement('img');
      img.className = 'cut-thumb';
      img.src = cut.imageData;
      content.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'cut-thumb-placeholder';
      ph.textContent = '\uD83D\uDDBC';
      content.appendChild(ph);
    }

    const info = document.createElement('div');
    info.className = 'cut-info';
    info.innerHTML =
      '<div class="cut-number">CUT ' + (idx + 1) + '</div>' +
      '<div class="cut-text-preview">' + (cut.text || '') + '</div>';
    content.appendChild(info);

    const durLabel = document.createElement('div');
    durLabel.className = 'cut-duration-label';
    durLabel.textContent = durSec + 's';

    el.appendChild(content);
    el.appendChild(durLabel);

    el.addEventListener('click', () => openCutModal(cut.id));
    area.appendChild(el);
  });
}

// Cut modal
function openCutModal(cutId) {
  const project = getProject(currentProjectId);
  const cut = project.cuts.find(c => c.id === cutId);
  if (!cut) return;
  currentCutId = cutId;

  const idx = project.cuts.indexOf(cut);
  document.getElementById('cut-modal-title').textContent = 'CUT ' + (idx + 1) + ' \u7DE8\u96C6';
  document.getElementById('cut-text').value = cut.text || '';

  const imgArea = document.getElementById('cut-image-area');
  if (cut.imageData) {
    imgArea.innerHTML = '<img src="' + cut.imageData + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">';
  } else {
    imgArea.innerHTML = '<div class="image-upload-icon">&#128444;</div><div class="image-upload-text">\u30BF\u30C3\u30D7\u3057\u3066\u753B\u50CF\u3092\u9078\u629E</div>';
  }

  document.getElementById('btn-merge-prev').disabled = idx === 0;
  document.getElementById('btn-merge-next').disabled = idx === project.cuts.length - 1;

  showModal('modal-cut');
}

document.getElementById('cut-image-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('cut-image-area').innerHTML =
      '<img src="' + ev.target.result + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">';
    const project = getProject(currentProjectId);
    const cut = project.cuts.find(c => c.id === currentCutId);
    if (cut) cut._tempImage = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('btn-save-cut').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  const cut = project.cuts.find(c => c.id === currentCutId);
  if (!cut) return;
  cut.text = document.getElementById('cut-text').value;
  if (cut._tempImage) { cut.imageData = cut._tempImage; delete cut._tempImage; }
  saveProjects();
  hideModal('modal-cut');
  renderTimeline();
});

document.getElementById('btn-cancel-cut').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  const cut = project.cuts.find(c => c.id === currentCutId);
  if (cut) delete cut._tempImage;
  hideModal('modal-cut');
});

document.getElementById('btn-delete-cut').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  if (project.cuts.length <= 1) { alert('\u6700\u5F8C\u306E\u30AB\u30C3\u30C8\u306F\u524A\u9664\u3067\u304D\u307E\u305B\u3093'); return; }
  if (!confirm('\u3053\u306E\u30AB\u30C3\u30C8\u3092\u524A\u9664\u3057\u307E\u3059\u304B\uFF1F')) return;

  const idx = project.cuts.findIndex(c => c.id === currentCutId);
  const cut = project.cuts[idx];
  if (idx > 0) {
    project.cuts[idx - 1].endTime = cut.endTime;
  } else {
    project.cuts[idx + 1].startTime = cut.startTime;
  }
  project.cuts.splice(idx, 1);
  saveProjects();
  hideModal('modal-cut');
  renderTimeline();
});

document.getElementById('btn-merge-prev').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  const idx = project.cuts.findIndex(c => c.id === currentCutId);
  if (idx <= 0) return;
  if (!confirm('\u524D\u306E\u30AB\u30C3\u30C8\u3068\u7D50\u5408\u3057\u307E\u3059\u304B\uFF1F')) return;
  project.cuts[idx - 1].endTime = project.cuts[idx].endTime;
  project.cuts.splice(idx, 1);
  saveProjects();
  hideModal('modal-cut');
  renderTimeline();
});

document.getElementById('btn-merge-next').addEventListener('click', () => {
  const project = getProject(currentProjectId);
  const idx = project.cuts.findIndex(c => c.id === currentCutId);
  if (idx >= project.cuts.length - 1) return;
  if (!confirm('\u6B21\u306E\u30AB\u30C3\u30C8\u3068\u7D50\u5408\u3057\u307E\u3059\u304B\uFF1F')) return;
  project.cuts[idx].endTime = project.cuts[idx + 1].endTime;
  project.cuts.splice(idx + 1, 1);
  saveProjects();
  hideModal('modal-cut');
  renderTimeline();
});

function showModal(id) { document.getElementById(id).classList.add('active'); }
function hideModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) hideModal(overlay.id);
  });
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

renderProjectList();
renderRuler();
</script>
